version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: chatii-db-dev
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chatii_dev
    ports:
      - "5432:5432"
    volumes:
      - dev_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: chatii-redis-dev
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - dev_redisdata:/data

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: chatii-app-dev
    restart: always
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - CHATII_ENV=development
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=chatii_dev
      - POSTGRES_HOST=db
      - REDIS_HOST=redis
      - LOG_LEVEL=DEBUG
      - LOG_FORMAT=CONSOLE
    depends_on:
      - db
      - redis

volumes:
  dev_pgdata:
  dev_redisdata:
