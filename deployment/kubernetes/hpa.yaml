apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: chatii-hpa
  namespace: chatii
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: chatii-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
