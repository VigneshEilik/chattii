apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatii-api
  namespace: chatii
  labels:
    app: chatii-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chatii-api
  template:
    metadata:
      labels:
        app: chatii-api
    spec:
      serviceAccountName: chatii-sa
      containers:
      - name: chatii-api
        image: chatii-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: chatii-config
        - secretRef:
            name: chatii-secret
        startupProbe:
          httpGet:
            path: /health/startup
            port: 8000
          failureThreshold: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8000
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8000
          periodSeconds: 10
        resources:
          limits:
            cpu: "4"
            memory: 8Gi
            nvidia.com/gpu: "1"
          requests:
            cpu: "2"
            memory: 4Gi
            nvidia.com/gpu: "1"
