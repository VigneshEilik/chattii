version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: chatii-db-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chatii_prod_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chatii_prod_secure_password_replace_me}
      POSTGRES_DB: ${POSTGRES_DB:-chatii_prod}
    volumes:
      - prod_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: chatii-redis-prod
    restart: always
    volumes:
      - prod_redisdata:/data

  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: chatii-app-prod
    restart: always
    ports:
      - "8000:8000"
    environment:
      - CHATII_ENV=production
      - POSTGRES_USER=${POSTGRES_USER:-chatii_prod_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-chatii_prod_secure_password_replace_me}
      - POSTGRES_DB=${POSTGRES_DB:-chatii_prod}
      - POSTGRES_HOST=db
      - REDIS_HOST=redis
      - LOG_LEVEL=INFO
      - LOG_FORMAT=JSON
    depends_on:
      - db
      - redis

volumes:
  prod_pgdata:
  prod_redisdata:
