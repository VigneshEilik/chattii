[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chatii"
version = "0.1.0"
description = "A production-ready modular transformer framework built from scratch"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]
dependencies = [
    "torch>=2.1.0",
    "numpy>=1.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0.1",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "psycopg2-binary>=2.9.9",
    "redis>=5.0.1",
    "faiss-cpu>=1.7.4",
    "datasets>=2.14.0",
    "sentencepiece>=0.1.99"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.5",
    "mypy>=1.7.0"
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "C90"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.setuptools]
packages = [
    "core",
    "core.utils",
    "core.interfaces",
    "core.common",
    "engine",
    "engine.tokenizer",
    "engine.transformer",
    "engine.training",
    "engine.inference",
    "api",
    "cli",
    "serving",
    "memory",
    "multimodal",
    "rag",
    "tools",
    "datasets",
    "datasets.registry",
    "models",
    "models.registry",
    "monitoring",
    "monitoring.metrics",
    "monitoring.profiling",
    "monitoring.tracing"
]

